<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEEPFIELD — Offline Mining</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="game-ui.css"></head>
<body class="game-mode">
<header class="game-topbar"><div class="brand">◈ DEEPFIELD <small>นักขุดแห่งใต้พิภพ</small></div><div class="location-badge"><span class="location-dot"></span><span id="sectorlabel">COPPER RIDGE</span><span id="depth">40 m</span></div><div class="top-actions"><div id="wallet"></div><button id="fullscreen" class="icon-button" aria-label="เต็มหน้าจอ" title="เต็มหน้าจอ">⛶</button><details class="game-settings"><summary aria-label="เมนูเซฟ" title="เมนูเซฟ">⚙</summary><div class="settings-popover"><strong>บันทึกการผจญภัย</strong><button id="export" class="quiet">↓ ส่งออกเซฟ</button><label class="quiet import">↑ นำเข้าเซฟ<input id="import" type="file" accept="application/json" hidden></label><span id="savehint">บันทึกอัตโนมัติในเครื่อง</span></div></details></div></header>
<main class="game-shell">
<section id="mineview" aria-label="ฉากขุดแร่"><div class="scene"><canvas id="world" aria-label="เหมืองแร่สามมิติ"></canvas><div class="cave-vignette"></div><div class="lantern-light"></div><div class="cave-rim left-rim"></div><div class="cave-rim right-rim"></div><div class="ore-marker"><span>แหล่งขุดปัจจุบัน</span><strong id="rockname"></strong><div id="deposit-preview"></div></div><div class="aim-reticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div id="prompt" aria-live="polite"></div><div id="loot-banner" class="loot-banner" role="status" hidden></div><div id="toast" role="status">กด SPACE เพื่อเริ่มขุด • จับจังหวะวงให้ตรงเส้น</div><div class="scene-bottom"><button id="mine"><span class="mine-symbol">⚒</span><span>ขุดแร่<small>จับจังหวะให้ตรงเส้นวง</small></span><kbd>SPACE</kbd></button></div></div></section>
<aside class="hud-player" aria-label="สถานะนักขุด"><div class="miner-portrait" aria-hidden="true"><svg viewBox="0 0 80 80"><path d="M18 65V47Q14 17 40 15q26 2 22 32v18Z" fill="#71513a"/><path d="M24 33h32v20Q40 74 24 53Z" fill="#c99d74"/><path d="M18 35Q16 9 40 9t22 26Z" fill="#d3a54f"/><path d="M13 33h54v7H13Z" fill="#9f7530"/><path d="M33 17h14v15H33Z" fill="#56605b"/><circle cx="40" cy="25" r="6" fill="#fff4c3"/><path d="M28 46h8m8 0h8" stroke="#342d28" stroke-width="4"/><path d="M32 57q8 5 16 0" fill="none" stroke="#79513c" stroke-width="3"/><path d="M14 80V68l13-8 13 12 13-12 13 8v12Z" fill="#3f6556"/></svg></div><div id="playercard"></div></aside>
<aside class="hud-findings" aria-label="แร่ที่เก็บได้"><div class="hud-caption">◈ ของที่เก็บได้ <span id="count">0</span></div><div id="ores"></div><button data-tab="bag" class="open-inventory">เปิดกระเป๋า <kbd>B</kbd></button><div id="log" class="loot-log"></div></aside>
<div class="mine-condition"><span class="condition-label">⚠ สภาพเหมือง</span><p id="criticalinfo"></p></div>
<aside id="toolcard" class="hud-tool" aria-label="อีเตอร์ที่สวมใส่"></aside>
<nav class="game-hotbar" aria-label="เมนูเกม"><button data-tab="map" title="แผนที่เหมือง (M)"><kbd>M</kbd><b>♧</b><span>แผนที่เหมือง</span></button><button data-tab="shop" title="ร้านค้า (C)"><kbd>C</kbd><b>⚖</b><span>ร้านค้า</span></button><button data-tab="repair" title="ซ่อมอีเตอร์ (R)"><kbd>R</kbd><b>⚒</b><span>ซ่อม</span></button><button data-tab="upgrade" title="อัปเกรด (U)"><kbd>U</kbd><b>⇈</b><span>อัปเกรด</span></button><button data-tab="bag" title="กระเป๋า (B)"><kbd>B</kbd><b>▣</b><span>กระเป๋า</span></button></nav>
<div id="game-window" class="game-window" role="dialog" aria-modal="true" aria-labelledby="viewtitle" hidden><button class="window-backdrop" data-tab="mine" aria-label="กลับไปขุดแร่"></button><section class="window-frame"><div class="window-titlebar"><div><span class="eyebrow">DEEPFIELD / BASE CAMP</span><h2 id="viewtitle">กระเป๋านักขุด</h2></div><button data-tab="mine" class="window-close" aria-label="ปิดหน้าต่าง">✕ <kbd>ESC</kbd></button></div><div id="window-notice" class="window-notice" role="status"></div><div class="window-body"><div id="mine-atlas" hidden><div class="atlas-heading"><h3>แผนที่เหมือง</h3><span id="minecount" class="tiny"></span></div><div class="atlas-layout"><div id="deposits" class="deposits"></div><div id="droprates"></div></div></div><div id="storeview" hidden></div></div></section></div>
</main><footer class="game-status"><span>● OFFLINE</span><span id="stats"></span><span>SPACE ขุด · B กระเป๋า · M เหมือง · ESC ปิด</span></footer>
<script src="engine.js"></script><script src="progression.js"></script><script src="assets/kenney/rocks.js"></script><script src="game.js"></script></body></html>
