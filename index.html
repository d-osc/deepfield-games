<body class="game-mode">

<main class="game-shell">
<section id="mineview" aria-label="ฉากขุดแร่"><div class="scene"><canvas id="world" aria-label="เหมืองแร่สามมิติ"></canvas><div class="cave-vignette"></div><div class="lantern-light"></div><div class="cave-rim left-rim"></div><div class="cave-rim right-rim"></div><div class="ore-marker"><span>แหล่งขุดปัจจุบัน</span><strong id="rockname"></strong><div id="deposit-preview"></div><div class="rock-health"><span id="rock-health-text"></span><div class="rock-health-track"><i id="rock-health-fill"></i></div></div></div><div class="aim-reticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div id="prompt" aria-live="polite"></div><div id="loot-banner" class="loot-banner" role="status" hidden></div><div id="toast" role="status">กด W A S D เพื่อเริ่มขุด • จับจังหวะวงให้ตรงเส้น</div><div class="scene-bottom"><button id="mine"><span class="mine-symbol">⚒</span><span>ขุดแร่<small>จับจังหวะให้ตรงเส้นวง</small></span><kbd>W A S D</kbd></button><button id="auto-mine" aria-pressed="false" title="เริ่มรอบขุดต่อเนื่อง ต้องกด W A S D จับจังหวะเอง">▶ เริ่มรอบต่อเนื่อง</button></div></div></section>
